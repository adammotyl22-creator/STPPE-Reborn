[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

; Required libraries for this sketch
lib_deps =
    links2004/WebSockets @ ^2.4.1
    adafruit/Adafruit NeoPixel@^1.12.0

; Build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0

; You can change `board` to match your exact board from https://platformio.org/boards
; Usage:
; cd "Firmware/ESP32_C3/Master_Bridge"
; pio run -t uploadfs     ; upload files in data/ to SPIFFS
; pio run -t upload       ; build and flash firmware
